# Render Blueprint – staging. Apply via Render Dashboard → Blueprints → New from repo.
# Secrets marked sync:false are entered in the dashboard, never committed.
services:
  - type: web
    name: dialogbot-api-staging
    runtime: python
    region: frankfurt
    plan: standard            # 2 workers + the travel searches need more than 512 MB
    rootDir: .
    buildCommand: pip install -r requirements.lock
    # Migrations run as an explicit pre-deploy step with the migration role, not at app startup.
    preDeployCommand: DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-access-log  # app/core/logging.py logs every request, with secret paths redacted
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    domains:                   # own domain: TikTok only pulls post images from a verified URL prefix (docs/social-media.md)
      - api.dialogbot.dk
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: staging         # same hardening as prod; simulated mail still allowed until Resend is verified
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: DATABASE_URL       # runtime role (limited), Supabase session pooler or direct
        sync: false
      - key: MIGRATION_DATABASE_URL  # migration role, direct connection
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_SCHEMA
        value: dialogbot
      - key: EMAIL_ADAPTER   # dashboard-managed ("resend" since 6 Oct 2026); sync: false so a blueprint sync cannot
        sync: false            # silently flip mail back to "simulated" (it did on 7 Oct 2026 and no mail left the system)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET   # Resend → Webhooks → signing secret (whsec_…); without it the webhook answers 503
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AI_PROVIDER       # set in the dashboard: "anthropic" once ANTHROPIC_API_KEY is added; unset = none (AI endpoints answer 501)
        sync: false
      - key: AI_MODEL_ID
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPI_SERVER_SECRET   # voice webhook credential (Bearer); without it telephony is off
        sync: false
      - key: CVR_USERNAME         # optional: CVR register lookup (free access from Erhvervsstyrelsen)
        sync: false
      - key: CVR_PASSWORD
        sync: false
      - key: SALES_AGENT_VOICE_ID   # optional: ElevenLabs voice id for Peter, who rings demo calls (default: catalogue voice)
        sync: false
      - key: ELEVENLABS_API_KEY   # optional: "Hør stemmen" voice sample in Settings → Telephony
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SOCIAL_PROVIDER      # set in the dashboard ("live" since 8 Oct 2026; "none" is the emergency brake). A value
        sync: false               # here would be re-applied on every blueprint sync and silently switch posting off/on.
      - key: SOCIAL_REQUIRE_APPROVAL  # "true": the operator approves every post in the dashboard (dashboard-managed)
        sync: false
      - key: SOCIAL_WEEKDAYS      # "0,1,2,3,4,5,6" = every day (dashboard-managed)
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_INSTAGRAM_USER_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REFRESH_TOKEN
        sync: false
      - key: CREDENTIALS_KEY      # also encrypts TikTok's rotating refresh token (same value in API and worker)
        sync: false
      - key: SUPABASE_URL         # dashboard-managed; private bucket "browser-evidence" holds browser-run evidence
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # dashboard-managed (service_role key)
        sync: false
      - key: BROWSER_WORKER_ENABLED   # dashboard-managed; the API only starts browser runs when "true" (needs the two above)
        sync: false
      - key: TRACK17_API_KEY      # Pakker app (17TRACK); empty = the app stays «Kommer snart». Same value on the worker.
        sync: false
      - key: DUFFEL_ACCESS_TOKEN  # Rejser app: flight prices (dashboard-managed)
        sync: false
      - key: TRAVELPAYOUTS_TOKEN  # Rejser app: fares + affiliate booking links (dashboard-managed)
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: PRIVAT_PARTNER_LINKS # partner links in the Privat apps, always marked «Annonce»; empty = none (dashboard-managed)
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # Public API (docs/public-api.md): the same code, APP_SURFACE=public, so only /v1 (API keys) and /health are served
  # – no sessions, no provider webhooks, no Stripe/Vapi/Twilio secrets in this process. Webhook deliveries are made by
  # the worker above (outbox), so this service needs only the database and the credentials key (webhook secrets).
  # DNS: api.dialogbot.app → this service (CNAME to Render; the internal API keeps api.dialogbot.dk).
  - type: web
    name: dialogbot-public-api
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.lock
    # No preDeployCommand: migrations run once, from dialogbot-api-staging's pre-deploy step. /health/ready answers
    # 503 until the database is on this build's Alembic head, so a deploy ahead of the migration never goes live.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-access-log
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    domains:
      - api.dialogbot.app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: staging
      - key: APP_SURFACE
        value: public
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: DATABASE_URL       # runtime role (limited), same database as the internal API
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: DATABASE_URL}
      - key: SECRET_KEY
        generateValue: true    # any >=32-char value; API keys are opaque DB digests so it need not match the API
      - key: DB_SCHEMA
        value: dialogbot
      - key: CREDENTIALS_KEY      # encrypts webhook signing secrets; must equal the worker's (it decrypts them)
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: CREDENTIALS_KEY}
      - key: PUBLIC_API_BASE_URL
        value: https://api.dialogbot.app
      - key: PUBLIC_API_READ_RPM
        value: "600"
      - key: PUBLIC_API_WRITE_RPM
        value: "60"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: dialogbot-worker-staging
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.lock
    startCommand: python -m app.worker.runner
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: staging
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false            # any >=32-char value; sessions are opaque DB tokens so it need not match the API
      - key: DB_SCHEMA
        value: dialogbot
      - key: EMAIL_ADAPTER   # dashboard-managed ("resend"); sync: false — see the API service above
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SOCIAL_PROVIDER      # set in the dashboard ("live" since 8 Oct 2026; "none" is the emergency brake). A value
        sync: false               # here would be re-applied on every blueprint sync and silently switch posting off/on.
      - key: SOCIAL_REQUIRE_APPROVAL  # "true": the operator approves every post in the dashboard (dashboard-managed)
        sync: false
      - key: SOCIAL_WEEKDAYS      # "0,1,2,3,4,5,6" = every day (dashboard-managed)
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_INSTAGRAM_USER_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REFRESH_TOKEN
        sync: false
      - key: CREDENTIALS_KEY      # also encrypts TikTok's rotating refresh token (same value in API and worker)
        sync: false
      - key: PUBLIC_BASE_URL      # the platforms download the post images from here, so it must be public https
        sync: false
      - key: CVR_USERNAME         # "Profiler at følge": the worker's daily batch comes from the CVR register
        sync: false
      - key: CVR_PASSWORD
        sync: false
      - key: TRACK17_API_KEY      # Pakker app: the worker polls 17TRACK for followed parcels
        sync: false
      - key: WORKER_LEASE_SECONDS
        value: "60"
      - key: WORKER_MAX_ATTEMPTS
        value: "5"

  # Browser worker: books on external public booking pages after a human yes in the Privat app (docs/ADR-004-browser-worker.md).
  # Off until BROWSER_WORKER_ENABLED=true (set in the dashboard, after the legal review of each booking engine's terms).
  # Exactly ONE instance: live Playwright sessions are in-process, and it claims only the privat.browser_* outbox events.
  # Network: the container should have no access to cloud metadata (Render private-network setting; not verified here).
  - type: worker
    name: dialogbot-browser-worker-staging
    runtime: docker
    region: frankfurt
    plan: standard            # Chromium needs more than 512 MB
    dockerfilePath: ./browser_worker/Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: ENABLE_DEV_TOOLS
        value: "false"
      # Secrets are copied from the API service (fromService), so they are never typed twice or committed.
      - key: DATABASE_URL
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: DATABASE_URL}
      - key: SECRET_KEY
        generateValue: true    # any >=32-char value; it need not match the API
      - key: DB_SCHEMA
        value: dialogbot
      - key: EMAIL_ADAPTER
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: EMAIL_ADAPTER}
      - key: RESEND_API_KEY
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: RESEND_API_KEY}
      - key: EMAIL_FROM
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: EMAIL_FROM}
      - key: FRONTEND_BASE_URL
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: FRONTEND_BASE_URL}
      - key: AI_PROVIDER
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: AI_PROVIDER}
      - key: AI_MODEL_ID
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: ANTHROPIC_API_KEY}
      - key: SUPABASE_URL
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: SUPABASE_URL}
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: {type: web, name: dialogbot-api-staging, envVarKey: SUPABASE_SERVICE_ROLE_KEY}
      - key: BROWSER_WORKER_ENABLED   # dashboard-managed; "false" keeps the worker idle
        sync: false
      - key: BROWSER_EVIDENCE_BUCKET
        value: browser-evidence
      - key: BROWSER_MAX_STEPS
        value: "25"
      - key: BROWSER_MAX_SECONDS
        value: "180"
      - key: BROWSER_APPROVAL_TTL_SECONDS
        value: "600"
      - key: BROWSER_ALLOWED_ENGINES
        value: onlinebooq
      - key: WORKER_LEASE_SECONDS
        value: "60"
      - key: WORKER_MAX_ATTEMPTS
        value: "5"
