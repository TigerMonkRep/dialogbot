# Render Blueprint – staging. Apply via Render Dashboard → Blueprints → New from repo.
# Secrets marked sync:false are entered in the dashboard, never committed.
services:
  - type: web
    name: dialogbot-api-staging
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.lock
    # Migrations run as an explicit pre-deploy step with the migration role, not at app startup.
    preDeployCommand: DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: staging         # same hardening as prod; simulated mail still allowed until Resend is verified
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: DATABASE_URL       # runtime role (limited), Supabase session pooler or direct
        sync: false
      - key: MIGRATION_DATABASE_URL  # migration role, direct connection
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_SCHEMA
        value: dialogbot
      - key: EMAIL_ADAPTER
        value: simulated       # switch to "resend" once the Resend domain + key are verified (Milestone B)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET   # Resend → Webhooks → signing secret (whsec_…); without it the webhook answers 503
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AI_PROVIDER       # set in the dashboard: "anthropic" once ANTHROPIC_API_KEY is added; unset = none (AI endpoints answer 501)
        sync: false
      - key: AI_MODEL_ID
        value: claude-opus-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPI_SERVER_SECRET   # voice webhook credential (Bearer); without it telephony is off
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: dialogbot-worker-staging
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.lock
    startCommand: python -m app.worker.runner
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: staging
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false            # any >=32-char value; sessions are opaque DB tokens so it need not match the API
      - key: DB_SCHEMA
        value: dialogbot
      - key: EMAIL_ADAPTER
        value: simulated
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: WORKER_LEASE_SECONDS
        value: "60"
      - key: WORKER_MAX_ATTEMPTS
        value: "5"
