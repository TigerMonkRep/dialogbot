[project]
name = "dialogbot"
version = "0.1.0"
description = "Dialogbot backend – etape 1: fundament og personlig opsætning"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.0",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "email-validator>=2.2",
  "pwdlib[argon2]==0.3.1",
  "structlog==26.1.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.setuptools]
packages = ["app", "scripts", "client"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "UP017", "UP046", "UP047", "E501"]
