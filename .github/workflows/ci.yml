name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dialogbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dialogbot_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dialogbot_test
      ENABLE_DEV_TOOLS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Lint
        run: ruff check app tests scripts client
      - name: Migrate from empty database
        run: alembic upgrade head
      - name: Migration is complete (no drift between models and migrations)
        run: |
          alembic check
      - name: Tests (integration against PostgreSQL)
        run: pytest
      - name: OpenAPI export matches committed contract
        run: |
          python -m scripts.export_openapi /tmp/openapi.json
          cmp docs/openapi.json /tmp/openapi.json
