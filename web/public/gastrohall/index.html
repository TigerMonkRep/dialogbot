<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon.png">
<title>Gastro Hall – manuskript · Dialogbot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
html, body { margin: 0; }
/* Layout: one scrolling manuscript, numbered sections as building-guide steps; Peter's lines as speech bubbles, the
   customer's objections as dark bubbles from the right, system instructions as quiet notes, checks as lists. */
:root {
  --paper: #FFFFFF; --panel: #EEF4FB; --ink: #14213D; --ink-soft: #3C4659; --muted: #5B6475; --line: #D6DEEA;
  --accent: #2456F6; --accent-deep: #1A3FC0; --highlight: #FFCF3F; --danger: #B3261E; --danger-soft: #FFDAD6; --ok-soft: #DDF5E4; --ok: #1B6B3A;
  --display: "Outfit", "Segoe UI", system-ui, sans-serif; --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1630; --panel: #14213D; --ink: #F4F7FC; --ink-soft: #D6DEEA; --muted: #9AA6BF; --line: #2B3A5C;
  --accent: #5B82FF; --accent-deep: #7C9BFF; --highlight: #FFCF3F; --danger: #FF8A80; --danger-soft: #4A1F1C; --ok-soft: #1B3A2A; --ok: #8FE0A8; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0D1630; --panel: #14213D; --ink: #F4F7FC; --ink-soft: #D6DEEA; --muted: #9AA6BF; --line: #2B3A5C;
  --accent: #5B82FF; --accent-deep: #7C9BFF; --highlight: #FFCF3F; --danger: #FF8A80; --danger-soft: #4A1F1C; --ok-soft: #1B3A2A; --ok: #8FE0A8; color-scheme: dark }
body { background: var(--panel); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); }
header.top .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
.mark { display: inline-flex; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); align-items: center; justify-content: center; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.yellow { background: var(--highlight); border-color: var(--ink); color: #14213D; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-width: 1.5px; }
.btn:focus-visible, .input:focus-visible, [contenteditable]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.input { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 17px; width: 100%; }

/* Gate */
#gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding-block: 48px; }
.gatecard { width: 100%; max-width: 440px; background: var(--paper); border: 2px solid var(--ink); border-radius: 20px; padding: 28px; box-shadow: 8px 8px 0 var(--ink); display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; letter-spacing: -1px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; letter-spacing: -0.5px; margin: 0; text-wrap: balance; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; min-height: 1.2em; }

/* Document */
#doc[hidden] { display: none; }
.hero { padding-block: 36px 8px; display: flex; flex-direction: column; gap: 10px; }
.hero p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
nav.toc { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 6px; scrollbar-width: none; }
nav.toc::-webkit-scrollbar { display: none; }
nav.toc a { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 6px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; }
nav.toc a .n { display: inline-flex; width: 24px; height: 24px; border-radius: 7px; background: var(--highlight); color: #14213D; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 13px; }
.sections { display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
section.step { background: var(--paper); border: 2px solid var(--ink); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 90px; }
@media (min-width: 640px) { section.step { padding: 28px 30px; } }
.sechead { display: flex; align-items: center; gap: 14px; }
.num { display: inline-flex; flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--highlight); color: #14213D; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 24px; }
.blocks { display: flex; flex-direction: column; gap: 12px; }
.b { position: relative; }
.b [contenteditable] { min-height: 1.4em; }
.note { margin: 0; color: var(--ink-soft); font-size: 16px; }
.lead { margin: 0; font-weight: 600; color: var(--ink); }
.quote { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
@media (min-width: 640px) { .quote, .objection { max-width: 88%; } }
.quote .bubble, .objection .bubble { flex: 0 1 auto; min-width: 0; }
.quote .av { display: inline-flex; flex: none; width: 30px; height: 30px; border-radius: 999px; background: var(--accent); color: #fff; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 13px; }
.quote .bubble { margin: 0; padding: 12px 16px; border: 2px solid var(--ink); border-radius: 16px 16px 16px 4px; background: var(--paper); font-size: 18px; line-height: 1.5; }
.objection { display: flex; gap: 10px; align-items: flex-end; justify-content: flex-end; max-width: 100%; margin-left: auto; }
.objection .bubble { margin: 0; padding: 12px 16px; border: 2px solid var(--ink); border-radius: 16px 16px 4px 16px; background: var(--ink); color: var(--paper); font-size: 17px; line-height: 1.5; font-weight: 600; }
:root[data-theme="dark"] .objection .bubble, .dark-objection { }
.objection .av { display: inline-flex; flex: none; width: 30px; height: 30px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--ink); color: var(--ink); align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 13px; }
.message { margin: 0; padding: 14px 16px; border: 1.5px solid var(--ink); border-radius: 14px; background: var(--panel); font-size: 16px; line-height: 1.5; }
.message::before { content: "SMS"; display: block; font-size: 11px; letter-spacing: .12em; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
ul.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.list li { display: flex; gap: 10px; align-items: flex-start; }
ul.list li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 9px; border-radius: 3px; background: var(--accent); }
ul.list li span { flex: 1; min-width: 0; }
.field { color: var(--accent-deep); font-weight: 600; }

/* Edit mode */
body.editing .b { padding: 6px 6px 6px 8px; border-left: 3px solid var(--line); border-radius: 6px; }
body.editing .b:focus-within { border-left-color: var(--accent); }
.tools { display: none; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
body.editing .tools { display: flex; }
.tools button { min-height: 30px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.tools button:hover { border-color: var(--ink); color: var(--ink); }
.tools button.del { color: var(--danger); }
.addsec { display: none; justify-content: center; }
body.editing .addsec { display: flex; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.status { font-size: 13px; color: var(--muted); }
footer { padding-block: 28px; color: var(--muted); font-size: 13px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <span class="brand"><span class="mark"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4z"></path></svg></span>Dialogbot</span>
    <span class="status" id="status"></span>
    <span class="spacer"></span>
    <button type="button" class="btn small" id="btnEdit" hidden>Rediger</button>
    <button type="button" class="btn small primary" id="btnSave" hidden>Gem</button>
    <button type="button" class="btn small" id="btnCancel" hidden>Fortryd</button>
    <button type="button" class="btn small" id="btnLock" hidden>Lås</button>
  </div>
</header>

<main class="wrap">
  <div id="gate">
    <form class="gatecard" id="gateForm">
      <span class="eyebrow">Manuskript · fortroligt</span>
      <h1>Gastro Hall</h1>
      <p style="margin:0;color:var(--ink-soft)">Peter som bookingassistent. Indtast kodeordet for at åbne manuskriptet.</p>
      <label for="pw" class="eyebrow">Kodeord</label>
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Kodeord" required>
      <div class="err" id="gateErr" aria-live="polite"></div>
      <button type="submit" class="btn primary" style="min-height:52px;font-size:17px">Åbn manuskriptet</button>
    </form>
  </div>

  <div id="doc" hidden>
    <div class="hero">
      <span class="eyebrow">Udgående opkald · Peter, AI-assistent hos Gastro Hall</span>
      <h1 id="docTitle"></h1>
      <p id="docSub"></p>
    </div>
    <nav class="toc" id="toc" aria-label="Afsnit"></nav>
    <div class="sections" id="sections"></div>
    <div class="addsec" style="padding-top:18px"><button type="button" class="btn" id="btnAddSec">+ Tilføj afsnit</button></div>
  </div>
</main>

  let key = null;             // AES key derived from the password
  let password = null;
  let model = null;           // decrypted document
  let snapshot = null;        // model before editing (for Fortryd)


  const b64 = { to: (u) => btoa(String.fromCharCode(...u)), from: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
  const enc = new TextEncoder(), dec = new TextDecoder();
  async function deriveKey(pw, salt) {
    const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function decrypt(b, pw) {
    const k = await deriveKey(pw, b64.from(b.salt));
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.from(b.iv) }, k, b64.from(b.ct));
    return { k, doc: JSON.parse(dec.decode(plain)) };
  }
  async function encrypt(doc, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const k = await deriveKey(pw, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(doc))));
    return { v: 1, salt: b64.to(salt), iv: b64.to(iv), ct: b64.to(ct), updatedAt: new Date().toISOString() };
  }

  // Shared store: the latest encrypted version lives in Dialogbot's API (GET is public; PUT needs an operator login).
  const API = "/api/backend";
  const CSRF = { "x-requested-with": "dialogbot" };
  let canWrite = false, loggedIn = false;
  (async () => {
    try {
      const r = await fetch(API + "/public/pages/gastrohall", { credentials: "same-origin", cache: "no-store" });
      if (r.ok) { const d = (await r.json()).blob; if (d && d.ct && (!blob.updatedAt || d.updatedAt > blob.updatedAt)) { blob = d; if (model && password) await unlock(password, true); } }
    } catch (e) { /* offline: the embedded version is shown */ }
    try {
      const me = await fetch(API + "/auth/me", { credentials: "same-origin", cache: "no-store" });
      if (me.ok) { loggedIn = true; canWrite = Boolean((await me.json()).is_platform_operator); }
    } catch (e) { /* not logged in */ }
    if (model) updateButtons();
  })();

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const withFields = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<span class="field">[$1]</span>');
  const editing = () => document.body.classList.contains("editing");

  function render() {
    $("#docTitle").textContent = model.title;
    $("#docSub").textContent = model.subtitle || "";
    const toc = $("#toc"); toc.innerHTML = "";
    const wrap = $("#sections"); wrap.innerHTML = "";
    model.sections.forEach((s, si) => {
      const id = "s" + si;
      const a = document.createElement("a"); a.href = "#" + id;
      a.innerHTML = (s.num ? `<span class="n">${esc(s.num)}</span>` : "") + esc(s.heading); toc.appendChild(a);
      const sec = document.createElement("section"); sec.className = "step"; sec.id = id;
      sec.innerHTML = `<div class="sechead">${s.num ? `<span class="num" contenteditable="${editing()}" data-sec="${si}" data-k="num">${esc(s.num)}</span>` : ""}<h2 contenteditable="${editing()}" data-sec="${si}" data-k="heading">${esc(s.heading)}</h2></div>
        <div class="blocks"></div>
        <div class="tools"><button type="button" data-add="note">+ Note</button><button type="button" data-add="lead">+ Overskrift i afsnit</button><button type="button" data-add="quote">+ Peter siger</button><button type="button" data-add="objection">+ Kunden siger</button><button type="button" data-add="list">+ Punktliste</button><button type="button" data-add="message">+ SMS</button><button type="button" class="del" data-delsec="${si}">Slet afsnit</button></div>`;
      const blocks = sec.querySelector(".blocks");
      s.blocks.forEach((b, bi) => blocks.appendChild(renderBlock(b, si, bi)));
      sec.querySelectorAll("[data-add]").forEach((btn) => btn.addEventListener("click", () => {
        const t = btn.dataset.add; s.blocks.push(t === "list" ? { type: "list", items: ["Nyt punkt"] } : { type: t, text: t === "quote" ? "Ny replik" : t === "objection" ? "Ny indvending" : "Ny tekst" }); render();
      }));
      sec.querySelector("[data-delsec]").addEventListener("click", () => { model.sections.splice(si, 1); render(); });
      wrap.appendChild(sec);
    });
    bindEdits();
  }
  function renderBlock(b, si, bi) {
    const el = document.createElement("div"); el.className = "b " + b.type; const ce = `contenteditable="${editing()}" data-sec="${si}" data-b="${bi}"`;
    if (b.type === "quote") el.innerHTML = `<div class="quote"><span class="av">P</span><p class="bubble" ${ce} data-k="text">${withFields(b.text)}</p></div>`;
    else if (b.type === "objection") el.innerHTML = `<div class="objection"><p class="bubble" ${ce} data-k="text">${withFields(b.text)}</p><span class="av">K</span></div>`;
    else if (b.type === "message") el.innerHTML = `<p class="message" ${ce} data-k="text">${withFields(b.text)}</p>`;
    else if (b.type === "list") el.innerHTML = `<ul class="list">${b.items.map((it, ii) => `<li><span ${ce} data-item="${ii}">${withFields(it)}</span>${editing() ? `<button type="button" class="tools-inline" data-delitem="${ii}" aria-label="Slet punkt" style="border:0;background:none;color:var(--muted);cursor:pointer">✕</button>` : ""}</li>`).join("")}</ul>${editing() ? `<div class="tools"><button type="button" data-additem="1">+ Punkt</button><button type="button" class="del" data-delblock="1">Slet liste</button></div>` : ""}`;
    else el.innerHTML = `<p class="${b.type === "lead" ? "lead" : "note"}" ${ce} data-k="text">${withFields(b.text)}</p>`;
    if (b.type !== "list") el.innerHTML += `<div class="tools"><button type="button" data-up="1">↑</button><button type="button" data-down="1">↓</button><button type="button" class="del" data-delblock="1">Slet</button></div>`;
    const blocks = model.sections[si].blocks;
    el.querySelector("[data-delblock]")?.addEventListener("click", () => { blocks.splice(bi, 1); render(); });
    el.querySelector("[data-up]")?.addEventListener("click", () => { if (bi > 0) { [blocks[bi - 1], blocks[bi]] = [blocks[bi], blocks[bi - 1]]; render(); } });
    el.querySelector("[data-down]")?.addEventListener("click", () => { if (bi < blocks.length - 1) { [blocks[bi + 1], blocks[bi]] = [blocks[bi], blocks[bi + 1]]; render(); } });
    el.querySelector("[data-additem]")?.addEventListener("click", () => { b.items.push("Nyt punkt"); render(); });
    el.querySelectorAll("[data-delitem]").forEach((x) => x.addEventListener("click", () => { b.items.splice(+x.dataset.delitem, 1); if (!b.items.length) blocks.splice(bi, 1); render(); }));
    return el;
  }
  function bindEdits() {
    document.querySelectorAll("[contenteditable]").forEach((el) => el.addEventListener("input", () => {
      const s = model.sections[+el.dataset.sec]; const text = el.innerText.replace(/\n+$/, "");
      if (el.dataset.k === "heading") s.heading = text;
      else if (el.dataset.k === "num") s.num = text;
      else if (el.dataset.item !== undefined) s.blocks[+el.dataset.b].items[+el.dataset.item] = text;
      else s.blocks[+el.dataset.b].text = text;
    }));
  }

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
  function updateButtons() {
    const on = editing();
    $("#btnEdit").hidden = on || !model; $("#btnSave").hidden = !on; $("#btnCancel").hidden = !on; $("#btnLock").hidden = !model || on;
    $("#status").textContent = model ? (on ? "Redigerer – husk at gemme" : (blob.updatedAt ? "Sidst gemt " + new Date(blob.updatedAt).toLocaleString("da-DK", { dateStyle: "medium", timeStyle: "short" }) : "")) : "";
    $("#btnEdit").textContent = canWrite ? "Rediger" : "Log ind for at redigere";
  }
  async function unlock(pw, silent) {
    try {
      const r = await decrypt(blob, pw); key = r.k; model = r.doc; password = pw;
      $("#gate").hidden = true; $("#doc").hidden = false; render(); updateButtons();
      if (!silent) toast("Manuskriptet er åbnet");
      return true;
    } catch (e) { if (!silent) $("#gateErr").textContent = "Forkert kodeord. Prøv igen."; return false; }
  }

  $("#gateForm").addEventListener("submit", (e) => { e.preventDefault(); $("#gateErr").textContent = ""; unlock($("#pw").value); });
  $("#btnEdit").addEventListener("click", () => {
    if (!canWrite) { location.href = loggedIn ? "/app" : "/login?next=%2Fgastrohall"; return; }
    snapshot = JSON.parse(JSON.stringify(model)); document.body.classList.add("editing"); render(); updateButtons();
  });
  $("#btnCancel").addEventListener("click", () => { model = snapshot; document.body.classList.remove("editing"); render(); updateButtons(); });
  $("#btnLock").addEventListener("click", () => { model = null; key = null; password = null; $("#doc").hidden = true; $("#gate").hidden = false; $("#pw").value = ""; updateButtons(); });
  $("#btnAddSec").addEventListener("click", () => { model.sections.push({ num: String(model.sections.filter((s) => s.num).length + 1), heading: "Nyt afsnit", blocks: [{ type: "note", text: "Ny tekst" }] }); render(); });
  $("#btnSave").addEventListener("click", async () => {
    const b = await encrypt(model, password);
    if (!canWrite) { toast(loggedIn ? "Kun Dialogbot-operatører kan gemme" : "Log ind som operatør for at gemme"); return; }
    try {
      const r = await fetch(API + "/operator/pages/gastrohall", { method: "PUT", credentials: "same-origin", headers: { "content-type": "application/json", ...CSRF }, body: JSON.stringify({ blob: b }) });
      if (!r.ok) { toast("Kunne ikke gemme (" + r.status + ")"); return; }
      blob = b; toast("Gemt – ændringerne ligger nu bag kodeordet");
    } catch (e) { toast("Kunne ikke gemme – ingen forbindelse"); return; }
    document.body.classList.remove("editing"); render(); updateButtons();
  });
})();
</script>
</body>
</html>
