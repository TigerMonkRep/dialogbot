[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
markers =
    sandbox: provider-sandbox tests against Stripe/Resend TEST surfaces (tests/sandbox; skipped without provider keys)
    sandbox_stripe: needs STRIPE_SECRET_KEY (Stripe test mode, sk_test_/rk_test_ only)
    sandbox_resend: needs RESEND_API_KEY (sends only to *@resend.dev test inboxes)
